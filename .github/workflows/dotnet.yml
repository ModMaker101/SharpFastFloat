name: .NET

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          9.0.x

    - name: Install Mono (for .NET Framework 4.7.2 test host)
      run: |
        sudo apt-get update
        sudo apt-get install -y mono-complete

    - name: Restore dependencies
      run: dotnet restore

    - name: Check formatting
      run: dotnet format SharpFastFloat.sln --no-restore --verify-no-changes

    - name: Build
      run: dotnet build --no-restore  --configuration Release -p:ContinuousIntegrationBuild=true

    - name: Unit tests
      run: dotnet test --no-build --configuration Release --verbosity m
      continue-on-error: false

    - name: Publish packages
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: '**/*.*nupkg'

  strict-parser:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        intrinsics: ["1", "0"]
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_EnableHWIntrinsic: ${{ matrix.intrinsics }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Test decimal scanners with SIMD and scalar paths
      run: dotnet test SharpFastFloat.Tests/SharpFastFloat.Tests.csproj -f net9.0 -c Release --filter 'FullyQualifiedName~StrictDoubleParserTests|FullyQualifiedName~StrictEntryPointTests|FullyQualifiedName~RegularScannerTests|FullyQualifiedName~ExactMidpointTests|FullyQualifiedName~RoundingIntegerTests'
